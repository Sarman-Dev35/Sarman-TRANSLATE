name: Translation MVP Tests

on:
  push:
    branches: [feature/complete-translation-mvp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime UI dependencies
        run: python -m pip install "PySide6>=6.7,<7" "keyring>=25.2,<27"
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Desktop UI smoke test
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from main import MainWindow
          app = QApplication([])
          window = MainWindow()
          assert window.pages.count() == 2
          assert window.studio_btn.isEnabled() is False
          print("Main window UI smoke test passed.")
          window.close()
          PY
