name: Translation MVP Tests

on:
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/translation-tests.yml'
  push:
    branches: [main, feature/complete-translation-mvp, feature/format-preservation-engine-readiness, feature/local-translation-engine-patch-management, feature/model-management-and-patch-controls, feature/signed-publisher-download-progress, fix/patch-export-rescan-and-branding, fix/language-selection-partial-patch-recovery, fix/stability-translation-throughput]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/translation-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Generate and validate Sarman application icon
        run: |
          python tools/build_icon.py
          if (!(Test-Path "assets/sarman-translate.ico")) { throw "Application icon was not generated." }
          if ((Get-Item "assets/sarman-translate.ico").Length -lt 1000) { throw "Application icon is unexpectedly small." }
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Windows desktop UI smoke test
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from main import MainWindow; from game_discovery import Game, discover_games; from translation_studio import TranslationStudio, GlossaryDialog; from translation_core import TextEntry; import tempfile; app=QApplication([]); w=MainWindow(); assert not w.windowIcon().isNull(); assert w.pages.count()==2; assert w.table.columnCount()==3; assert hasattr(w, 'uninstall_all_btn'); assert hasattr(w, 'remove_game_patches_btn'); assert hasattr(w, 'recover_incomplete_btn'); assert hasattr(w, 'source_language_combo'); assert hasattr(w, 'remove_partial_patch_btn'); d=tempfile.TemporaryDirectory(); w.games=[Game('Language Smoke','Test',d.name,detected_languages=('DE','TR'))]; w.render_games(); w.table.selectRow(0); assert set(w.source_language_combo.itemData(i) for i in range(w.source_language_combo.count()))=={'EN','DE','TR'}; w.source_language_combo.setCurrentIndex(w.source_language_combo.findData('DE')); assert 'Almanca' in w.source_language_hint.text(); studio=TranslationStudio(Game('Smoke Test','Test',d.name),w); assert studio.table.columnCount()==4; assert hasattr(studio, 'glossary_btn'); assert hasattr(studio, 'model_btn'); assert hasattr(studio, 'remove_model_btn'); studio_de=TranslationStudio(Game('German Smoke','Test',d.name),w,source_language='DE'); assert not studio_de.translate_btn.isEnabled(); assert 'DE' in studio_de.language_label.text(); studio_de.close(); glossary=GlossaryDialog(studio); assert glossary.table.columnCount()==2; glossary.close(); studio.entries=[TextEntry('smoke','sample.json','/hello','Hello')]; studio.render(); studio._translation_done(0,'Merhaba'); assert studio.table.item(0,3).text()=='Merhaba'; assert studio.autosave_timer.isActive(); studio.autosave_timer.stop(); assert isinstance(discover_games([]),list); studio.close(); w.close(); d.cleanup(); print('Windows desktop, locale selection and discovery smoke tests passed.')"
