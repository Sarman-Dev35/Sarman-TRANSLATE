name: Translation MVP Tests

on:
  push:
    branches: [main, feature/complete-translation-mvp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime UI dependencies
        run: python -m pip install "PySide6>=6.7,<7" "keyring>=25.2,<27"
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Windows desktop UI smoke test
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from main import MainWindow; from game_discovery import Game, discover_games; from translation_studio import TranslationStudio; from gemini_settings import GeminiSettingsDialog; import tempfile, credential_store; assert credential_store.ensure_secure_backend().__class__.__name__ == 'WinVaultKeyring'; app=QApplication([]); w=MainWindow(); assert w.pages.count()==2; assert w.table.columnCount()==5; assert not w.studio_btn.isEnabled(); d=tempfile.TemporaryDirectory(); studio=TranslationStudio(Game('Smoke Test','Test',d.name),w); assert studio.table.columnCount()==4; assert isinstance(discover_games([]),list); studio.close(); settings=GeminiSettingsDialog(w); settings.close(); w.close(); d.cleanup(); print('Windows desktop and discovery smoke tests passed.')"
