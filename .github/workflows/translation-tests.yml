name: Translation MVP Tests

on:
  push:
    branches: [feature/complete-translation-mvp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
