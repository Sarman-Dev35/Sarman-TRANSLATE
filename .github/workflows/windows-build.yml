name: Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --name "Sarman TRANSLATE" --collect-all PySide6 --collect-all keyring main.py
      - name: Sign Windows executable with Authenticode
        if: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "sarman-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match '\\x64\\signtool.exe        uses: actions/upload-artifact@v4
        with:
          name: Sarman-TRANSLATE-Windows
          path: dist/Sarman TRANSLATE/
          if-no-files-found: error
 } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signtool) { throw "Windows SDK signtool.exe was not found." }
            $exe = Join-Path $PWD "dist\Sarman TRANSLATE\Sarman TRANSLATE.exe"
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $certificatePath /p $env:CERTIFICATE_PASSWORD $exe
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed." }
            & $signtool.FullName verify /pa /v $exe
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signature verification failed." }
          }
          finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }
      - name: Explain unsigned build when no certificate is configured
        if: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 == '' || secrets.WINDOWS_CERTIFICATE_PASSWORD == '' }}
        run: echo "::warning::No Authenticode certificate secrets configured. The executable will be unsigned and Windows SmartScreen may show an unknown publisher warning."
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Sarman-TRANSLATE-Windows
          path: dist/Sarman TRANSLATE/
          if-no-files-found: error
