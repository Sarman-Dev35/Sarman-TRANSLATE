name: Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --name "Sarman TRANSLATE" --version-file version_info.txt --collect-all PySide6 --collect-all llama_cpp main.py
      - name: Launch packaged Windows app smoke test
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\Sarman TRANSLATE\Sarman TRANSLATE.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            throw "Packaged Sarman TRANSLATE exited during startup."
          }
          Stop-Process -Id $process.Id -Force
      - name: Check whether signing secrets are configured
        id: signing_config
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:CERTIFICATE_BASE64 -and $env:CERTIFICATE_PASSWORD) {
            "configured=true" >> $env:GITHUB_OUTPUT
          }
          else {
            "configured=false" >> $env:GITHUB_OUTPUT
          }
      - name: Sign packaged Windows binaries with Authenticode
        if: ${{ steps.signing_config.outputs.configured == 'true' }}
        shell: pwsh
        env:
          SIGN_CERT_B64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "sarman-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGN_CERT_B64))
            $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.Directory.Name -eq "x64" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signtool) { throw "Windows SDK signtool.exe was not found." }

            $dist = Join-Path $PWD "dist\Sarman TRANSLATE"
            $binaries = Get-ChildItem -Path $dist -Recurse -File |
              Where-Object { $_.Extension -in @(".exe", ".dll", ".pyd") }
            if (-not $binaries) { throw "No packaged PE binaries were found to sign." }

            foreach ($binary in $binaries) {
              & $signtool.FullName sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $certificatePath /p $env:SIGN_CERT_PASSWORD $binary.FullName
              if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed: $($binary.FullName)" }
              & $signtool.FullName verify /pa /v $binary.FullName
              if ($LASTEXITCODE -ne 0) { throw "Authenticode signature verification failed: $($binary.FullName)" }
            }
            "Signed and verified $($binaries.Count) packaged binaries."
          }
          finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }
      - name: Explain unsigned build when no certificate is configured
        if: ${{ steps.signing_config.outputs.configured != 'true' }}
        run: echo "::warning::No trusted Authenticode certificate configured. CompanyName metadata may show Sarman Studios, but Windows cannot verify the publisher and Smart App Control may block this UNSIGNED build. Do not disable Windows protection."
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Sarman-TRANSLATE-Windows-${{ steps.signing_config.outputs.configured == 'true' && 'signed' || 'unsigned' }}
          path: dist/Sarman TRANSLATE/
          if-no-files-found: error
